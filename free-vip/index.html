    function normalizeLang(raw) {
      if (!raw) return null;
      const tag = String(raw).replace(/_/g, "-");
      const lower = tag.toLowerCase();
      if (T[tag]) return tag;
      if (lower.startsWith("zh")) {
        if (lower.includes("hant") || lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-mo")) {
          return "zh-Hant";
        }
        return "zh-Hans";
      }
      if (lower.startsWith("pt")) return "pt-BR";
      const base = lower.split("-")[0];
      const map = {
        en: "en", ja: "ja", ko: "ko", de: "de", fr: "fr", it: "it",
        es: "es", ru: "ru", id: "id", vi: "vi", tr: "tr", bn: "bn",
      };
      return map[base] || null;
    }

    function currentLangFromURL() {
      const params = new URLSearchParams(window.location.search);
      return normalizeLang(params.get("lang")) || "en";
    }

    function setLang(lang, pushHistory) {
      const id = normalizeLang(lang) || "en";
      const copy = T[id] || T.en;
      document.documentElement.lang = id;
      document.title = copy.title + " · AnimalClock";
      document.getElementById("title").textContent = copy.title;
      document.getElementById("subtitle").textContent = copy.subtitle;
      document.getElementById("intro").textContent = copy.intro;
      document.getElementById("rulesHeading").textContent = copy.rulesHeading;
      document.getElementById("ruleTeacher").textContent = copy.ruleTeacher;
      document.getElementById("ruleStudent").textContent = copy.ruleStudent;
      document.getElementById("ruleSocial").textContent = copy.ruleSocial;
      document.getElementById("quota").textContent = copy.quota;
      document.getElementById("howto").textContent = copy.howto;
      document.getElementById("note").textContent = copy.note;
      document.getElementById("footer").textContent = copy.footer;

      const contactEl = document.getElementById("contact");
      contactEl.innerHTML = "";
      contactEl.appendChild(document.createTextNode(copy.contact + " "));
      const mail = document.createElement("a");
      mail.href = "mailto:" + SUPPORT_EMAIL + "?subject=" + encodeURIComponent(copy.title);
      mail.textContent = SUPPORT_EMAIL;
      contactEl.appendChild(mail);

      document.querySelectorAll("#langSwitch button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === id);
      });

      if (pushHistory) {
        const url = new URL(window.location.href);
        url.searchParams.set("lang", id);
        history.replaceState(null, "", url.toString());
      }
    }

    function buildSwitcher() {
      const root = document.getElementById("langSwitch");
      LANGS.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.lang = item.id;
        btn.textContent = item.label;
        btn.addEventListener("click", () => setLang(item.id, true));
        root.appendChild(btn);
      });
    }

    buildSwitcher();
    setLang(currentLangFromURL(), false);
  </script>
