        storage: "主要なデータは原則として端末内に保存されます。アプリアンインストールやデータ削除により、端末内データは通常削除されます（iOS の動作に従います）。個人の位置データを長期保管する自社クラウドアカウントは運営していません。",
        h7: "7. 子どものプライバシー",
        children: "本アプリは一般向けであり、子どもから個人情報を収集することを目的としません。保護者の方が不適切な提供があったと考える場合は、上記メールまでご連絡ください。",
        h8: "8. お客様の選択",
        ch1: "システム設定で位置情報をオフにできます（日の出・日の入りや位置表示が使えなくなる場合があります）；",
        ch2: "位置情報を使わずに時計や太陽系などの機能を利用できます；",
        ch3: "アプリを削除して利用を終了し、関連する端末内データを削除できます（システム動作に従います）。",
        h9: "9. 変更",
        changes: "本ポリシーは随時更新されることがあり、本ページの施行日を改訂します。重要な変更については、App Store の製品ページ等で合理的なお知らせに努めます。",
        h10: "10. 適用範囲",
        scope: "本ポリシーは、本体アプリ「宇宙時計」および付属ウィジェット（同一製品）に適用されます。",
        footer: "© 2026 宇宙時計 Universe Clock。本ページは App Store のプライバシー開示用です。",
        footerNote: "連絡先メールは App Store の連絡先と一致させてください。",
      },
    };

    const IDS = [
      "title", "subtitle", "effective", "intro",
      "h1", "developer", "contact",
      "h2", "collectLead", "c1", "c2", "c3", "c4", "c5",
      "h3", "network1", "network2",
      "h4", "u1", "u2", "u3", "u4",
      "h5", "share1", "s1", "s2", "s3", "share2",
      "h6", "storage",
      "h7", "children",
      "h8", "ch1", "ch2", "ch3",
      "h9", "changes",
      "h10", "scope",
      "footer", "footerNote",
    ];

    function detectLang() {
      const raw = (navigator.language || "en").toLowerCase();
      if (raw.startsWith("zh")) {
        if (raw.includes("hant") || raw.includes("tw") || raw.includes("hk") || raw.includes("mo")) {
          return "zh-Hant";
        }
        return "zh-Hans";
      }
      if (raw.startsWith("ja")) return "ja";
      return "en";
    }

    function apply(lang) {
      const t = T[lang] || T.en;
      document.documentElement.lang = lang;
      document.title = t.title + " · Privacy";
      IDS.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (id === "contact") {
          el.innerHTML = `${t.contact} <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a>`;
        } else {
          el.textContent = t[id] || "";
        }
      });
      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      try { localStorage.setItem("uc-privacy-lang", lang); } catch (_) {}
    }

    function boot() {
      const switchEl = document.getElementById("langSwitch");
      LANGS.forEach(({ id, label }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.dataset.lang = id;
        btn.addEventListener("click", () => apply(id));
        switchEl.appendChild(btn);
      });
      let lang = detectLang();
      try {
        const saved = localStorage.getItem("uc-privacy-lang");
        if (saved && T[saved]) lang = saved;
      } catch (_) {}
      apply(lang);
    }

    boot();
  </script>
</body>
</html>
